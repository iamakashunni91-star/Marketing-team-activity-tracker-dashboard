name: Update Dashboard

on:
  schedule:
    - cron: '0 * * * *'        # every hour — dashboard refresh
    - cron: '30 06 * * 1-5'    # 06:30 UTC = 12:00 PM IST, Mon–Fri — missing-updates email
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas openpyxl requests

      - name: Set up Node (for StatiCrypt)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Run dashboard updater
        env:
          SHAREPOINT_URL:         ${{ secrets.SHAREPOINT_URL }}
          REVENUE_SHAREPOINT_URL: ${{ secrets.REVENUE_SHAREPOINT_URL }}
        run: python dashboard.py

      - name: Encrypt dashboard with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          # dashboard.py wrote fresh data into dashboard_plain.html.
          # Encrypt it into index.html (what GitHub Pages serves).
          rm -rf staticrypt_out
          staticrypt dashboard_plain.html \
            --password "$STATICRYPT_PASSWORD" \
            --short \
            --template-title "Way Marketing - Business Impact Dashboard" \
            -d staticrypt_out
          mv staticrypt_out/dashboard_plain.html index.html
          rm -rf staticrypt_out
          echo "Encrypted dashboard_plain.html -> index.html"

      - name: Commit and push if changed
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "actions@github.com"
          git add index.html dashboard_plain.html missing_yesterday.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Send missing-updates email
        if: ${{ github.event.schedule == '30 06 * * 1-5' || github.event_name == 'workflow_dispatch' }}
        run: python send_missing_email.py
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
